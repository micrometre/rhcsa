---
- name: Install lvm2 (inside the VM)
  ansible.builtin.package:
    name: lvm2
    state: present
  delegate_to: rhcsa-node1
  become: yes

- name: Create a 10GB disk named "rhcsa-data1.qcow2"
  ansible.builtin.command: qemu-img create -f qcow2 rhcsa-data1.qcow2 10G
  args:
    chdir: /var/lib/libvirt/images/
    creates: /var/lib/libvirt/images/rhcsa-data1.qcow2
  become: yes

- name: Check if disk vdb is already attached
  ansible.builtin.shell: virsh domblklist rhcsa-node1 | grep -q vdb
  become: yes
  register: vdb_check
  changed_when: false
  failed_when: false

- name: Attach the disk to rhcsa-node1
  ansible.builtin.command: >
    virsh attach-disk rhcsa-node1
    --source /var/lib/libvirt/images/rhcsa-data1.qcow2
    --target vdb
    --persistent
    --driver qemu
    --subdriver qcow2
  become: yes
  when: vdb_check.rc != 0

- name: List block devices for rhcsa-node1
  ansible.builtin.command: virsh domblklist rhcsa-node1
  become: yes
  register: domblklist_output
  changed_when: false

- name: Show block devices
  ansible.builtin.debug:
    var: domblklist_output.stdout_lines

- name: Check if Physical Volume exists on /dev/vdb
  ansible.builtin.command: pvs /dev/vdb
  delegate_to: rhcsa-node1
  become: yes
  register: pv_check
  changed_when: false
  failed_when: false

- name: Stamp the raw drive with the LVM header Create Physical Volume on /dev/vdb (inside the VM)
  ansible.builtin.command: pvcreate /dev/vdb
  delegate_to: rhcsa-node1
  become: yes
  when: pv_check.rc != 0

- name: Verify Physical Volume
  ansible.builtin.command: pvdisplay /dev/vdb
  delegate_to: rhcsa-node1
  become: yes
  register: pvdisplay_output
  changed_when: false
  ignore_errors: yes

- name: Show PV verification
  ansible.builtin.debug:
    var: pvdisplay_output.stdout_lines

- name: Check if Volume Group data_vg exists
  ansible.builtin.command: vgs data_vg
  delegate_to: rhcsa-node1
  become: yes
  register: vg_check
  changed_when: false
  failed_when: false

- name: Create Volume Group by adding the PV into a new storage pool named data_vg
  ansible.builtin.command: vgcreate data_vg /dev/vdb
  delegate_to: rhcsa-node1
  become: yes
  when: vg_check.rc != 0

- name: Verify Volume Group
  ansible.builtin.command: vgdisplay data_vg
  delegate_to: rhcsa-node1
  become: yes
  register: vgdisplay_output
  changed_when: false
  ignore_errors: yes

- name: Show VG verification
  ansible.builtin.debug:
    var: vgdisplay_output.stdout_lines

- name: Check if Logical Volume app_lv exists
  ansible.builtin.command: lvs data_vg/app_lv
  delegate_to: rhcsa-node1
  become: yes
  register: app_lv_check
  changed_when: false
  failed_when: false

- name: Create Logical Volume app_lv
  ansible.builtin.command: lvcreate -y -n app_lv -L 4G data_vg
  delegate_to: rhcsa-node1
  become: yes
  when: app_lv_check.rc != 0

- name: Verify Logical Volume
  ansible.builtin.command: lvdisplay /dev/data_vg/app_lv
  delegate_to: rhcsa-node1
  become: yes
  register: lvdisplay_output
  changed_when: false
  ignore_errors: yes

- name: Show LV verification
  ansible.builtin.debug:
    var: lvdisplay_output.stdout_lines

- name: Check if Logical Volume db_lv exists
  ansible.builtin.command: lvs data_vg/db_lv
  delegate_to: rhcsa-node1
  become: yes
  register: db_lv_check
  changed_when: false
  failed_when: false

- name: Create Logical Volume db_lv, Slice a 4GB volume named db_lv out of your data_vg pool
  ansible.builtin.command: lvcreate -y -n db_lv -L 4G data_vg
  delegate_to: rhcsa-node1
  become: yes
  when: db_lv_check.rc != 0

- name: Verify db_lv Logical Volume
  ansible.builtin.command: lvdisplay /dev/data_vg/db_lv
  delegate_to: rhcsa-node1
  become: yes
  register: db_lvdisplay_output
  changed_when: false
  ignore_errors: yes

- name: Show db_lv verification
  ansible.builtin.debug:
    var: db_lvdisplay_output.stdout_lines

- name: Check if db_lv is already formatted
  ansible.builtin.command: blkid /dev/mapper/data_vg-db_lv
  delegate_to: rhcsa-node1
  become: yes
  register: db_lv_fs_check
  changed_when: false
  failed_when: false

- name: Format db_lv with XFS
  ansible.builtin.command: mkfs.xfs /dev/mapper/data_vg-db_lv
  delegate_to: rhcsa-node1
  become: yes
  when: db_lv_fs_check.rc != 0

- name: Create mount point /mnt/database
  ansible.builtin.file:
    path: /mnt/database
    state: directory
  delegate_to: rhcsa-node1
  become: yes

- name: Check if db_lv is already mounted
  ansible.builtin.shell: mount | grep -q '/mnt/database'
  delegate_to: rhcsa-node1
  become: yes
  register: mount_check
  changed_when: false
  failed_when: false

- name: Mount db_lv to /mnt/database
  ansible.builtin.command: mount /dev/mapper/data_vg-db_lv /mnt/database
  delegate_to: rhcsa-node1
  become: yes
  when: mount_check.rc != 0

- name: Verify the mount
  ansible.builtin.shell: df -h | grep /mnt/database
  delegate_to: rhcsa-node1
  become: yes
  register: mount_verify
  changed_when: false
  failed_when: false

- name: Show mount verification
  ansible.builtin.debug:
    var: mount_verify.stdout_lines

- name: Ensure your Volume Group actually has space left to give.    
  ansible.builtin.command: vgs data_vg
  delegate_to: rhcsa-node1
  become: yes
  register: vg_space_check
  changed_when: false

- name: Show VG space verification
  ansible.builtin.debug:
    var: vg_space_check.stdout_lines

- name: Check db_lv current size
  ansible.builtin.command: lvs --noheadings -o lv_size /dev/data_vg/db_lv
  delegate_to: rhcsa-node1
  become: yes
  register: current_db_lv_size
  changed_when: false

- name: Extend the Volume and Filesystem Together
  ansible.builtin.command: lvextend -r -L +1G /dev/mapper/data_vg-db_lv
  delegate_to: rhcsa-node1
  become: yes
  register: lvextend_output
  changed_when: "'successfully resized' in lvextend_output.stdout"
  when: "'4.00g' in current_db_lv_size.stdout"

- name: Show LV extend output
  ansible.builtin.debug:
    var: lvextend_output.stdout_lines | default('Already extended')

# ── Final Summary ────────────────────────────────────────────────────

- name: Gather Physical Volume summary (JSON)
  ansible.builtin.command: pvs --reportformat json
  delegate_to: rhcsa-node1
  become: yes
  register: pvs_summary
  changed_when: false

- name: Gather Volume Group summary (JSON)
  ansible.builtin.command: vgs --reportformat json
  delegate_to: rhcsa-node1
  become: yes
  register: vgs_summary
  changed_when: false

- name: Gather Logical Volume summary (JSON)
  ansible.builtin.command: lvs --reportformat json
  delegate_to: rhcsa-node1
  become: yes
  register: lvs_summary
  changed_when: false

- name: Gather block device tree (JSON)
  ansible.builtin.command: lsblk -J -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS /dev/vdb
  delegate_to: rhcsa-node1
  become: yes
  register: lsblk_summary
  changed_when: false

- name: "LVM SETUP SUMMARY"
  ansible.builtin.debug:
    msg: "{{ {'block_devices': (lsblk_summary.stdout | from_json).blockdevices, 'physical_volumes': (pvs_summary.stdout | from_json).report[0].pv, 'volume_groups': (vgs_summary.stdout | from_json).report[0].vg, 'logical_volumes': (lvs_summary.stdout | from_json).report[0].lv} | to_nice_json }}"